name: 发布安装包

# 打 v* 标签时自动构建正式签名包并挂到对应 release；也可以在 Actions 页面手动跑，
# 手动跑且填了 publish_tag 时把包上传到那个已有 release，留空则只构建（产物在 Artifact 里）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "上传到哪个已有 release（例如 v0.2.6）；留空只构建不上传"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拒绝提交凭据（见 SECURITY.md）
        run: python3 tools/check_public_tree.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 平台与构建工具
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # 密钥库不进仓库：base64 存在仓库 Secret，构建时还原成文件再用。
      - name: 还原签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 ANDROID_KEYSTORE_BASE64，无法出签名包" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/signing/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "$RUNNER_TEMP/signing/signing.properties"
          unset KEYSTORE_PASSWORD KEY_PASSWORD

      # 连接参数同样不进仓库（构建脚本要求目录里只有这一个文件）。
      - name: 还原连接参数
        env:
          IDENTITY_B64: ${{ secrets.HYUNDAIC_IDENTITY_B64 }}
        run: |
          if [ -z "$IDENTITY_B64" ]; then
            echo "缺少 HYUNDAIC_IDENTITY_B64，打出来的包会提示缺少连接参数" >&2
            exit 1
          fi
          mkdir -p identity
          printf '%s' "$IDENTITY_B64" | base64 -d > identity/hyundaic-identity.json
          ls -l identity

      - name: 构建正式包
        env:
          HYUNDAIC_SIGNING: ${{ runner.temp }}/signing/signing.properties
          HYUNDAIC_IDENTITY_DIR: ${{ github.workspace }}/identity
        run: ./gradlew --console=plain assembleRelease

      - name: 核对签名与包名
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "没生成正式包" >&2; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion|targetSdkVersion|application-label)'

      - name: 重命名产物
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          OUT="HyundaiHC-${VER}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hyundaic-release-apk
          path: ${{ steps.apk.outputs.path }}

      - name: 挂到 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ github.event.inputs.publish_tag }}
        run: |
          TAG="$PUBLISH_TAG"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          if [ -z "$TAG" ]; then
            echo "没有指定 release，只出 Artifact"
            exit 0
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "HyundaiHC $TAG" --generate-notes
          fi
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
